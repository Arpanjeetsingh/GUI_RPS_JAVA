name: Historian Record Commit

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  record-merge-commit:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install historian
        env:
          HISTORIAN_INSTALL_URL: ${{ vars.HISTORIAN_INSTALL_URL || 'git+https://github.com/jomiangel/historian.git@main' }}
        run: pip install "${HISTORIAN_INSTALL_URL}"

      - name: Configure git
        run: |
          git config user.name "historian[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Record merge commit summary
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'groq' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_MAX_CONCURRENT: ${{ vars.LLM_MAX_CONCURRENT || '2' }}
        run: |
          SHA="${{ github.event.pull_request.merge_commit_sha }}"
          historian record --repo . --sha "${SHA}"

      - name: Push cache update
        run: git push
