name: Historian Release Docs

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: write

jobs:
  document-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install historian
        env:
          HISTORIAN_INSTALL_URL: ${{ vars.HISTORIAN_INSTALL_URL || 'git+https://github.com/jomiangel/historian.git@main' }}
        run: pip install "${HISTORIAN_INSTALL_URL}"

      - name: Resolve previous tag
        id: tags
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          if PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null)"; then
            echo "prev=${PREV}" >> "${GITHUB_OUTPUT}"
          else
            PREV="$(git rev-list --max-parents=0 HEAD)"
            echo "prev=${PREV}" >> "${GITHUB_OUTPUT}"
            echo "No previous tag; using root commit ${PREV}"
          fi
          echo "Documenting ${PREV}..${TAG}"

      - name: Generate release docs
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'groq' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_MAX_CONCURRENT: ${{ vars.LLM_MAX_CONCURRENT || '2' }}
        run: |
          TAG="${{ steps.tags.outputs.tag }}"
          PREV="${{ steps.tags.outputs.prev }}"
          historian read --repo . --from "${PREV}" --to "${TAG}"
          if [ -f docs/FDD.md ]; then
            historian fact-check --repo . --doc docs/FDD.md --from "${PREV}" --to "${TAG}" || true
          else
            echo "No docs/FDD.md — skipping drift check."
          fi

      - name: Open docs pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: historian/docs-${{ steps.tags.outputs.tag }}
          title: "📜 Historian: docs for ${{ steps.tags.outputs.tag }}"
          commit-message: "docs: historian release chapter for ${{ steps.tags.outputs.tag }}"
          body: |
            Auto-generated by [historian](https://github.com/${{ github.repository }}) on tag `${{ steps.tags.outputs.tag }}`.

            Range: `${{ steps.tags.outputs.prev }}` → `${{ steps.tags.outputs.tag }}`

            Please review the generated markdown before merging.

            - Release chapter under `docs/chapters/`
            - Drift report at `docs/drift_report.md` (when `docs/FDD.md` exists)
          add-paths: |
            docs/
